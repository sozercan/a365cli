name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache: true

      - name: Configure macOS signing
        id: macos_signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          set -euo pipefail

          use_adhoc_signing() {
            local reason="$1"
            echo "WARN: $reason" >&2
            echo "WARN: Darwin release binaries will be signed ad-hoc." >&2
            echo "identity=" >> "$GITHUB_OUTPUT"
            echo "signing_mode=adhoc" >> "$GITHUB_OUTPUT"
          }

          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PWD" ] || [ -z "$MACOS_KEYCHAIN_PWD" ]; then
            use_adhoc_signing "MACOS_CERTIFICATE, MACOS_CERTIFICATE_PWD, or MACOS_KEYCHAIN_PWD is not configured."
            exit 0
          fi

          keychain_path="$RUNNER_TEMP/a365-signing.keychain-db"
          cert_path="$RUNNER_TEMP/a365-signing.p12"

          if ! printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$cert_path"; then
            use_adhoc_signing "MACOS_CERTIFICATE is not valid base64."
            exit 0
          fi

          security create-keychain -p "$MACOS_KEYCHAIN_PWD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PWD" "$keychain_path"

          if ! security import "$cert_path" -P "$MACOS_CERTIFICATE_PWD" \
            -t cert -f pkcs12 -k "$keychain_path" \
            -T /usr/bin/codesign -T /usr/bin/security; then
            rm -f "$cert_path"
            use_adhoc_signing "MACOS_CERTIFICATE could not be imported."
            exit 0
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PWD" "$keychain_path" >/dev/null

          security list-keychains -d user -s "$keychain_path" \
            $(security list-keychains -d user | tr -d '"')

          rm -f "$cert_path"

          identity_hash=$(security find-identity -v -p codesigning "$keychain_path" 2>/dev/null \
            | awk '/"Developer ID Application:/ && developer == "" { developer = $2 } /"Apple Development:/ && development == "" { development = $2 } END { if (developer != "") print developer; else if (development != "") print development }' || true)

          if [ -z "$identity_hash" ]; then
            use_adhoc_signing "Imported keychain has no Developer ID Application or Apple Development identity."
            exit 0
          fi

          echo "::add-mask::$identity_hash"
          echo "identity=$identity_hash" >> "$GITHUB_OUTPUT"
          echo "signing_mode=cert" >> "$GITHUB_OUTPUT"
          echo "Using certificate-backed macOS signing identity."

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          # Keep the existing Homebrew formula flow until a deliberate cask migration.
          version: v2.15.4
          args: release --clean
        env:
          A365_CODESIGN_IDENTITY: ${{ steps.macos_signing.outputs.identity }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_REPO_TOKEN: ${{ secrets.HOMEBREW_REPO_TOKEN }}

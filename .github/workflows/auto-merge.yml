name: Auto-merge Dependabot PRs

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI checks
        run: |
          echo "Waiting for CI checks to complete..."
          for i in $(seq 1 60); do
            RESULT=$(gh pr checks "$PR_URL" --json workflow,bucket --jq '[.[] | select(.workflow != "Auto-merge Dependabot PRs") | .bucket] | if length == 0 or any(. == "pending") then "pending" elif all(. == "pass" or . == "skipping") then "pass" else "fail" end')
            echo "Attempt $i: $RESULT"
            if [ "$RESULT" = "pass" ]; then
              echo "All checks passed!"
              exit 0
            elif [ "$RESULT" = "fail" ]; then
              echo "Some checks failed, skipping merge"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for checks"
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge
        run: gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$HEAD_SHA"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

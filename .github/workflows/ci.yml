name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: A365_DISABLE_PERSISTENT_TOKEN_CACHE=1 go test ./... -count=1 -cover -race

  build-linux-windows:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: >
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build
          -ldflags "-X github.com/sozercan/a365cli/internal/version.Version=${{ github.ref_name }}
          -X github.com/sozercan/a365cli/internal/version.Commit=${{ github.sha }}"
          -o a365-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a365-${{ matrix.goos }}-${{ matrix.goarch }}
          path: a365-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}

  build-darwin:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache: true

      - name: Compile native Keychain-capable arm64 binary
        run: >
          CGO_ENABLED=1 go build
          -ldflags "-X github.com/sozercan/a365cli/internal/version.Version=${{ github.ref_name }}
          -X github.com/sozercan/a365cli/internal/version.Commit=${{ github.sha }}
          -X github.com/sozercan/a365cli/internal/auth.persistentTokenCacheName=a365-ci"
          -o a365-darwin-arm64-native .

      - name: Build disposable static arm64 artifact
        run: >
          CGO_ENABLED=0 go build
          -ldflags "-X github.com/sozercan/a365cli/internal/version.Version=${{ github.ref_name }}
          -X github.com/sozercan/a365cli/internal/version.Commit=${{ github.sha }}"
          -o a365-darwin-arm64 .

      - name: Upload artifact (arm64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a365-darwin-arm64
          path: a365-darwin-arm64

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache: true

      - name: Install and run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run

version: 2

project_name: a365

before:
  hooks:
    - /usr/bin/env A365_DISABLE_PERSISTENT_TOKEN_CACHE=1 go test ./... -count=1
    - >-
      /bin/sh -eu -c 'if [ -z "${A365_CODESIGN_IDENTITY:-}" ] ||
      [ "$A365_CODESIGN_IDENTITY" = "-" ]; then
      echo "A365_CODESIGN_IDENTITY must name a certificate-backed signing identity for release builds." >&2;
      exit 1; fi'

builds:
  # Darwin must be built natively with CGO so the Azure auth cache can use
  # macOS Keychain. The release workflow runs on macOS and provides a required
  # Apple Development or Developer ID Application identity before these
  # post-build hooks execute.
  - id: a365-darwin
    binary: a365
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/sozercan/a365cli/internal/version.Version={{.Version}}
      - -X github.com/sozercan/a365cli/internal/version.Commit={{.ShortCommit}}
      - -X github.com/sozercan/a365cli/internal/auth.persistentTokenCacheName=a365
    hooks:
      post:
        - cmd: >-
            /bin/sh -eu -c 'exec /usr/bin/codesign --force --options runtime
            --timestamp --identifier com.github.sozercan.a365
            --sign "$A365_CODESIGN_IDENTITY" "$1"' -- "{{ .Path }}"
          output: true
        - cmd: /usr/bin/codesign --verify --strict --verbose=2 "{{ .Path }}"
          output: true
        - cmd: >-
            /bin/sh -eu -c 'go version -m "$1" | grep -q "CGO_ENABLED=1";
            details=$(/usr/bin/codesign -dv --verbose=4 "$1" 2>&1);
            printf "%s\n" "$details" | grep -Eq "^Authority=(Apple Development|Developer ID Application):";
            printf "%s\n" "$details" | grep -q "^Identifier=com.github.sozercan.a365$";
            printf "%s\n" "$details" | grep -q "^Timestamp=";
            printf "%s\n" "$details" | grep -q "^Runtime Version=";
            if printf "%s\n" "$details" | grep -q "^Signature=adhoc$"; then exit 1; fi;
            requirement=$(/usr/bin/codesign -d -r- "$1" 2>&1);
            printf "%s\n" "$requirement" | grep -q "^designated => identifier \"com.github.sozercan.a365\"";
            printf "%s\n" "$requirement" | grep -q "anchor apple generic";
            if printf "%s\n" "$requirement" | grep -q "cdhash"; then exit 1; fi' -- "{{ .Path }}"
          output: true

  # Linux and Windows remain pure-Go so they can be cross-compiled from the
  # macOS release runner. These portable artifacts do not include the CGO-backed
  # OS credential-store token cache.
  - id: a365-portable
    binary: a365
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/sozercan/a365cli/internal/version.Version={{.Version}}
      - -X github.com/sozercan/a365cli/internal/version.Commit={{.ShortCommit}}
      - -X github.com/sozercan/a365cli/internal/auth.persistentTokenCacheName=a365

archives:
  - id: default
    ids:
      - a365-darwin
      - a365-portable
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: sozercan
      name: homebrew-repo
      token: "{{ .Env.HOMEBREW_REPO_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/sozercan/a365cli"
    description: "CLI for Microsoft 365 via agent365 MCP servers"
    license: "MIT"
    install: |
      bin.install "a365"
    test: |
      system "#{bin}/a365", "--version"

release:
  github:
    owner: sozercan
    name: a365cli
  name_template: "{{.Tag}}"
